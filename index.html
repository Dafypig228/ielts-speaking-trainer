/* Layout idea: one column for one thumb. Content scrolls; the actions you use every few seconds
   (record, next) sit in a dock at the bottom, inside the easy thumb zone. 44px minimum targets. */
:root{
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:16px; --r-sm:12px;
  --nav-h:64px;
  --shadow:0 1px 2px color-mix(in oklab, var(--ink) 8%, transparent), 0 4px 16px color-mix(in oklab, var(--ink) 6%, transparent);
  --tap:44px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:24px} h3{font-size:17px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px calc(var(--nav-h) + 40px + env(safe-area-inset-bottom))}
body.has-dock .wrap{padding-bottom:calc(var(--nav-h) + 132px + env(safe-area-inset-bottom))}

/* header */
header.bar{position:sticky;top:0;z-index:20;background:color-mix(in oklab,var(--bg) 86%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.bar .in{max-width:720px;margin:0 auto;padding:8px 12px 8px 16px;display:flex;align-items:center;gap:10px;min-height:56px}
header.bar h1{font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.is-rec header.bar{border-bottom-color:var(--rec)}
body.is-rec header.bar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--rec);animation:recbar 1.4s ease-in-out infinite}
@keyframes recbar{50%{opacity:.35}}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;min-height:32px;padding:4px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;background:var(--surface)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.ok{color:var(--ok-ink);border-color:color-mix(in oklab,var(--ok) 35%,transparent);background:var(--ok-soft)} .chip.ok::before{background:var(--ok)}
.chip.warn{color:var(--warn-ink);border-color:color-mix(in oklab,var(--warn) 35%,transparent);background:var(--warn-soft)} .chip.warn::before{background:var(--warn)}
.chip.plain::before{display:none}
.iconbtn{width:var(--tap);height:var(--tap);border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;padding:0;flex:none;color:var(--ink)}
.iconbtn svg{width:20px;height:20px}
.iconbtn.on,.btn.on{color:var(--warn-ink);border-color:color-mix(in oklab,var(--warn) 45%,transparent);background:var(--warn-soft)}

/* bottom navigation: 5 destinations, icon + label, active state shown by a filled pill (not colour alone) */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted);text-decoration:none;font-weight:500}
nav.tabs a .ic{display:grid;place-items:center;width:56px;height:30px;border-radius:99px;transition:background .15s}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--ink);font-weight:600}
nav.tabs a[aria-current="page"] .ic{background:var(--accent-soft);color:var(--accent-ink)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:24px 2px 8px}
.sec-h h3{font-size:17px}

/* buttons: one primary per screen, the rest quieter */
.btn{min-height:var(--tap);border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;justify-content:center;text-decoration:none;color:var(--ink);transition:background .12s,transform .06s}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent-ink)}
.btn.danger{color:var(--rec-ink)}
.btn.big{min-height:52px;padding:14px 20px;font-size:17px}
.btn:disabled{opacity:.45;cursor:default}
@media (hover:hover){.btn:not(.primary):hover{background:var(--sunken)} .btn.primary:hover{filter:brightness(1.07)}}
.linkbtn{background:none;border:0;padding:10px 2px;margin:-10px -2px;color:var(--accent-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* home */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:16px;min-height:96px;box-shadow:var(--shadow)}
.action strong{font-family:var(--display);font-size:18px}
.action span{font-size:14px;color:var(--muted)}
.action.hero{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.action.hero span{color:inherit;opacity:.9}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px}
.tile b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--sunken);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* lists */
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;gap:12px;align-items:center;padding:12px 16px;min-height:56px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%;color:inherit;text-decoration:none}
.li:first-child{border-top:0}
@media (hover:hover){button.li:hover,a.li:hover{background:var(--sunken)}}
.li .t{font-weight:500}
.li .s{font-size:13.5px;color:var(--muted)}
.count{font-family:var(--mono);font-size:13px;min-width:32px;text-align:center;padding:3px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent-ink);flex:none}
.count.zero{background:transparent;color:var(--muted);border:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;font-size:12.5px;padding:2px 9px;border-radius:99px;background:var(--p1-soft);color:var(--p1);font-weight:600;white-space:nowrap}
.pill.p2{background:var(--p2-soft);color:var(--p2)}
.pill.p3{background:var(--p3-soft);color:var(--p3)}
.band{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:28px;padding:0 9px;border-radius:99px;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
button.band{border:0;min-height:var(--tap);min-width:var(--tap)}
.src{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;white-space:nowrap}

/* segmented controls & filters: 44px tall, selected = filled + bold (not colour alone) */
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:40px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-size:14.5px;font-weight:500;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.switcher{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunken);border-radius:var(--r-sm);padding:4px;gap:4px}
.switcher a{min-height:40px;display:grid;place-items:center;border-radius:9px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px}
.switcher a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* forms: 16px so iOS doesn't zoom on focus */
input[type=search],input[type=text],input[type=password],input[type=email],textarea,select{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%;min-height:var(--tap);font-size:16px}
input:focus,textarea:focus,select:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 25%,transparent)}
textarea{resize:vertical;min-height:72px}
select{width:auto;padding-right:28px}
label.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line);min-height:56px}
label.sw:first-child{border-top:0}
label.sw input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:none}

/* question */
.qmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.qtext{font-family:var(--display);font-size:clamp(23px,5.6vw,31px);font-weight:600;line-height:1.2;letter-spacing:-.015em;text-wrap:balance;margin:6px 0 2px}
.qtext.hidden{filter:blur(10px);user-select:none;cursor:pointer}
.cue{border:2px solid var(--ink);border-radius:var(--r);padding:16px 18px;background:var(--surface)}
.cue .qtext{margin-top:0}
.cue ul{margin:8px 0 0;padding-left:22px}
.cue li{margin:4px 0;font-size:16.5px}
.cue .say{font-size:14px;color:var(--muted);margin-top:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap}

/* inline recorder (sheets) */
.rec{display:flex;gap:16px;align-items:center;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.rec.on{border-color:var(--rec);background:var(--rec-soft)}
.recbtn{width:72px;height:72px;flex:none;border-radius:50%;border:0;background:var(--rec);color:var(--on-rec);display:grid;place-items:center;box-shadow:0 4px 14px color-mix(in oklab,var(--rec) 35%,transparent)}
.recbtn svg{width:30px;height:30px}
.rec.on .recbtn,.dock.on .dock-rec{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px color-mix(in oklab,var(--rec) 20%,transparent)}}
.rtime{font-family:var(--mono);font-size:28px;font-variant-numeric:tabular-nums}
.rtime small{font-size:14px;color:var(--muted)}
.tbar{height:8px;border-radius:99px;background:color-mix(in oklab,var(--rec) 16%,transparent);overflow:hidden;margin-top:6px}
.tbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s linear}
.tbar i.over{background:var(--warn)}
.lvl{height:4px;margin-top:6px;border-radius:99px;background:transparent;overflow:hidden}
.lvl i{display:block;height:100%;width:0;background:var(--rec)}
.partial{font-size:14px;color:var(--muted);margin-top:6px;max-height:3.2em;overflow:hidden}
.alts{display:flex;gap:16px;flex-wrap:wrap;margin-top:6px;font-size:14px}

/* bottom dock: record / next in the thumb zone */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:25;background:color-mix(in oklab,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.dock.on{background:color-mix(in oklab,var(--rec-soft) 92%,transparent);border-top-color:var(--rec)}
.dock-in{max-width:720px;margin:0 auto;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;min-height:88px}
.dock-mid{display:flex;align-items:center;gap:12px;justify-content:center;min-width:0}
.dock-rec{width:64px;height:64px;border-radius:50%;border:0;background:var(--rec);color:var(--on-rec);display:grid;place-items:center;flex:none;box-shadow:0 4px 14px color-mix(in oklab,var(--rec) 35%,transparent)}
.dock-rec svg{width:28px;height:28px}
.dock-time{display:flex;flex-direction:column;min-width:0;font-variant-numeric:tabular-nums}
.dock-time b{font-size:16px}
.dock-time small{font-size:13px;color:var(--muted)}
.dock-time span{font-family:var(--mono);font-size:24px;line-height:1}
.dock-time .tbar{width:120px}
.dock .btn{min-width:var(--tap)}

/* attempts */
.att{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.att:first-child{border-top:0}
.att.hide{display:none}
.play{width:var(--tap);height:var(--tap);border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;padding:0;flex:none}
.play svg{width:18px;height:18px}
.play.textonly{background:var(--sunken);color:var(--muted)}
.att-top{font-size:14.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.att-top .n{font-weight:700}
.prog{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.att details{grid-column:1/-1;font-size:15px}
.att details>summary{color:var(--accent-ink);font-size:14px;font-weight:600;cursor:pointer;min-height:36px;display:flex;align-items:center;gap:6px;list-style:none}
.att details>summary::-webkit-details-marker{display:none}
.att details>summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin:0 4px 0 2px}
.att details[open]>summary::before{transform:rotate(45deg)}
.att .side{display:flex;gap:6px;align-items:center}
.tag{font-size:12px;padding:1px 7px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.tag.warn{color:var(--warn-ink);border-color:color-mix(in oklab,var(--warn) 50%,transparent);background:var(--warn-soft)}
.ideas{white-space:pre-wrap;font-size:15px;background:var(--accent-soft);border-radius:var(--r-sm);padding:12px 14px;max-width:70ch}
.coach{border-top:1px solid var(--line);padding-top:12px;max-width:70ch}
.coach .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tr{background:var(--sunken);border-radius:var(--r-sm);padding:10px 12px;line-height:1.6;white-space:pre-wrap}
mark.pz{background:var(--rec-soft);color:var(--rec-ink);border-radius:4px;padding:0 4px;font-family:var(--mono);font-size:12.5px;font-weight:600}
mark.fl{background:var(--warn-soft);color:var(--warn-ink);border-radius:3px;padding:0 3px}
.fix{font-size:15px} .fix s{color:var(--muted)}
.challenge{border:2px dashed var(--accent);background:var(--accent-soft)}

/* mock runner */
.runner-top{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.steps{display:flex;gap:3px;margin:8px 0 14px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.steps i.done{background:var(--accent)}
.steps i.cur{background:var(--rec)}
.steps i.p2{flex:3}
.bigtimer{font-family:var(--mono);font-size:56px;text-align:center;font-variant-numeric:tabular-nums;line-height:1}
.phase{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:700}
.examiner{display:flex;gap:10px;align-items:flex-start;font-size:15px;color:var(--muted)}
.examiner svg{width:20px;height:20px;flex:none;margin-top:2px}
.examiner b{color:var(--ink)}

/* sheet, modal, toast */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
#sheet .scrim{position:absolute;inset:0;background:color-mix(in oklab,black 45%,transparent)}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;top:max(24px,env(safe-area-inset-top));max-width:720px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -8px 30px color-mix(in oklab,black 25%,transparent)}
#sheet .phead{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface);min-height:60px}
#sheet .phead .ttl{flex:1;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheet .pbody{overflow-y:auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom));flex:1;overscroll-behavior:contain}
#modal{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:color-mix(in oklab,black 50%,transparent);padding:20px}
#modal.open{display:grid}
#modal .box{background:var(--surface);border-radius:var(--r);padding:20px;max-width:400px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:var(--r-sm);font-size:15px;max-width:min(92vw,520px);display:none;align-items:center;gap:12px;box-shadow:var(--shadow)}
body.has-dock #toast{bottom:calc(var(--nav-h) + 104px + env(safe-area-inset-bottom))}
#toast.show{display:flex}
#toast button{background:transparent;border:1px solid color-mix(in oklab,var(--bg) 40%,transparent);color:var(--bg);border-radius:9px;min-height:36px;padding:4px 12px;font-weight:700;flex:none}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:15px}
.kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
@media (max-width:420px){.actions{grid-template-columns:1fr}.tiles b{font-size:21px}.dock-time .tbar{width:90px}}
@media (pointer:coarse){.kbd-hint{display:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

details.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
details.filters>summary{list-style:none;cursor:pointer;min-height:52px;display:flex;align-items:center;gap:10px;padding:8px 16px;font-weight:600}
details.filters>summary::-webkit-details-marker{display:none}
details.filters>summary .s{font-weight:400;color:var(--muted);font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.filters>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details.filters[open]>summary::after{transform:rotate(-135deg)}
details.filters .body{padding:0 16px 16px;display:flex;flex-direction:column;gap:10px}
.goalstats{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

</style>
</head>

}

/* --- drill --- */

/* --- mock test --- */
const M = {on: false, plan: [], i: 0, phase: '', sid: null, sess: null, card: null, cfg: {kind: 'random', set: 1}, prepEnd: 0, speakT0: 0, clock: 0, playingSess: null, t0: 0, reveal: false};
function topicIntro(t, first) { return first ? `Let's begin. In this first part, I'd like to ask you some questions about yourself. Let's talk about ${t.title.toLowerCase()}.` : `Now let's talk about ${t.title.toLowerCase()}.`; }
function buildPlan() {
  const plan = [];
  let card;
  if (M.cfg.kind === 'set') {
    const st = DATA.sets.find(s => s.n === +M.cfg.set);
    let last = null;
    st.p1.forEach(id => { const q = Q.get(id); plan.push({qid: id, part: 1, intro: last !== q.pid ? topicIntro(TM.get(q.pid), !plan.length) : ''}); last = q.pid; });
    card = CM.get(st.card);
  } else {
    const fx = pick(topics.filter(t => t.fixed));
    const others = shuffle(topics.filter(t => !t.fixed && t.qs.length >= 2 && matchSrc(t.src))).slice(0, Math.max(1, S.set.p1Topics - 1));
    [fx, ...others].forEach((t, ti) => subset(t.qs, ti === 0 ? 3 : 4).forEach((q, qi) => plan.push({qid: q.id, part: 1, intro: qi === 0 ? topicIntro(t, ti === 0) : ''})));
    const pool = cards.filter(c => c.p3.length >= 2 && matchSrc(c.src));
    const w = pool.flatMap(c => nAtt(c.p2id) ? [c] : [c, c, c]);
    card = pick(w.length ? w : cards);
  }
  plan.push({qid: card.p2id, part: 2});
  subset(card.p3, 5).forEach((q, i) => plan.push({qid: q.id, part: 3, intro: i === 0 ? `We've been talking about ${cueShort(card)}, and I'd like to discuss with you one or two more general questions related to this.` : ''}));
  return {plan, card};
}
function viewMock() {
  if (M.on && M.phase === 'done') return viewSummary(M.sess);
  if (M.on) return viewRunner();
  return `<div class="stack">
    <h2 style="font-size:24px">Mock speaking test</h2>
    <div class="muted small">Runs like the real exam: the examiner asks Part 1 questions on 2–4 topics, gives you a cue card with 1 minute to prepare and up to 2 minutes to talk, then asks Part 3 discussion questions on the same theme. Every answer is recorded and saved in order.</div>
    <div class="card stack" style="gap:12px">
      <div class="seg"><button data-act="mkind" data-v="random" aria-pressed="${M.cfg.kind === 'random'}">Random mix of topics</button><button data-act="mkind" data-v="set" aria-pressed="${M.cfg.kind === 'set'}">Real sets from 2nd update</button></div>
      ${M.cfg.kind === 'set' ? `<div class="list">${DATA.sets.map(s => { const c = CM.get(s.card); const tps = [...new Set(s.p1.map(id => TM.get(Q.get(id).pid).title))]; return `<button class="li" data-act="mset" data-v="${s.n}" aria-pressed="${+M.cfg.set === s.n}" style="${+M.cfg.set === s.n ? 'background:var(--accent-soft)' : ''}"><div class="grow"><div class="t">Set ${s.n}: ${esc(cueShort(c))}</div><div class="s">Part 1: ${esc(tps.join(', '))}</div></div></button>`; }).join('')}</div>`
      : `<div class="row small"><span class="muted grow">Topics from</span>${srcSeg()}</div><div class="row small"><span class="muted grow">Part 1 topics</span><select data-act="setv" data-k="p1Topics">${[2, 3, 4].map(v => `<option value="${v}" ${S.set.p1Topics == v ? 'selected' : ''}>${v}</option>`).join('')}</select></div>`}
      <label class="sw" style="border-top:0;padding:0"><span>Read questions aloud</span><input type="checkbox" data-act="setb" data-k="voice" ${S.set.voice ? 'checked' : ''}></label>
      <label class="sw" style="padding-bottom:0"><span>Hide question text (listen only)</span><input type="checkbox" data-act="setb" data-k="hideText" ${S.set.hideText ? 'checked' : ''}></label>
      <button class="btn primary big" data-act="mstart">${I.exam} Start the test</button>
      <div class="small muted">${recKind() === 'live' ? 'Recording starts automatically after each question.' : recKind() === 'dict' ? 'Answers are saved as transcripts (audio is blocked in this view).' : "For each answer, tap Record: your phone's voice recorder opens, and the clip comes back here when you save it."}</div>
    </div>
  </div>`;
}
function mockStart() {
  const {plan, card} = buildPlan();
  const sid = uid('s');
  Object.assign(M, {on: true, plan, i: 0, phase: 'ask', sid, card: card.id, t0: Date.now(), reveal: false});
  M.sess = {id: sid, ts: Date.now(), set: M.cfg.kind === 'set' ? +M.cfg.set : null, card: card.id, plan: plan.map(p => p.qid), items: [], scores: {}, note: '', done: false};

}
async function speakThenStep(first) {

  if (step.part === 2) { M.phase = 'cardintro'; render(); const c = CM.get(step.qid ? Q.get(step.qid).pid : M.card); await speak(`Now I'm going to give you a topic, and I'd like you to talk about it for one to two minutes. Before you talk, you'll have one minute to think about what you're going to say. You can make some notes if you wish. Here is your topic. ${c.cue}`); if (M.phase !== 'cardintro' || M.plan[M.i] !== step) return; M.phase = 'prep'; M.prepEnd = Date.now() + 60000; render(); return; }

  await speak((step.intro ? step.intro + ' ' : '') + Q.get(step.qid).t);
  if (!M.on || M.i !== my || M.phase !== 'ask') return;
  M.phase = 'answer'; render();
  if (recKind() === 'live' && S.set.autoRec) startRec(step.qid, {sid: M.sid, gesture: false, onDone: mockSaved});
  void first;
}
async function prepOver() {
  if (M.phase !== 'prep') return;
  beep(); M.phase = 'answer'; render();
  await speak("All right? Remember you have one to two minutes for this, so don't worry if I stop you. I'll tell you when the time is up. Can you start speaking now, please?");
  if (!M.on || M.phase !== 'answer' || R.on) return;

function mockSaved(aid) {

async function sbPull(uidv) {
  const sb = SB.client;
  let since = (await kvGet('sb-pull:' + uidv)) || '1970-01-01T00:00:00Z';
  let changed = false;
  for (let page = 0; page < 20; page++) {
    const {data, error} = await sb.from('attempts').select('*').gt('updated_at', since).order('updated_at', {ascending: true}).limit(500);
    if (error) throw error;
    if (!data.length) break;
    for (const r of data) {
      const loc = S.att.get(r.id);
      if (r.deleted) { if (loc) { S.att.delete(r.id); await IDB.del('att', r.id).catch(() => {}); await IDB.del('blob', r.id).catch(() => {}); urlCache.delete(r.id); changed = true; } continue; }
      if (!Q.has(r.qid)) continue;
      if (!loc) {
        const a = {id: r.id, qid: r.qid, part: r.part, ts: Number(r.ts), dur: r.dur, mime: r.mime, size: r.size, tr: r.tr || '', score: r.score, note: r.note || '', sid: r.sid, fb: r.fb, rpath: r.path, stats: r.stats, ai: r.ai, asset: null, enc: null, local: false, pushed: true, dirty: false};
        S.att.set(a.id, a); await IDB.put('att', a); changed = true;
      } else if (!loc.dirty) {
        Object.assign(loc, {tr: r.tr || '', score: r.score, note: r.note || '', fb: r.fb, rpath: loc.rpath || r.path, stats: r.stats || loc.stats, ai: r.ai || loc.ai, pushed: true});
        await IDB.put('att', stripMem(loc)); changed = true;
      }
    }
    since = data[data.length - 1].updated_at;
    await kvSet('sb-pull:' + uidv, since);
    if (data.length < 500) break;
  }
  for (const [table, cfgD] of Object.entries(DOCS)) {
    const pk = 'sb-pull-' + table + ':' + uidv;
    const s0 = (await kvGet(pk)) || '1970-01-01T00:00:00Z';
    const res = await sb.from(table).select('*').gt('updated_at', s0).order('updated_at', {ascending: true}).limit(1000);
    if (res.error) throw res.error;
    if (!res.data.length) continue;
    const dirty = (await kvGet('sb-dirty-' + table + ':' + uidv)) || [];
    let list = cfgD.list();
    for (const r of res.data) {
      if (dirty.includes(r.id)) continue;
      list = list.filter(x => x.id !== r.id);
      if (r.deleted) await IDB.del('kv', cfgD.kv + r.id).catch(() => {});
      else { const d = {...r.data, id: r.id}; list.push(d); const {id, ...body} = d; await IDB.put('kv', {id: cfgD.kv + r.id, ...body}); }
      changed = true;
    }
    cfgD.set(list);
    await kvSet(pk, res.data[res.data.length - 1].updated_at);
  }
  if (!(await kvGet('sb-metadirty:' + uidv))) {
    const {data, error} = await sb.from('meta').select('data,updated_at').maybeSingle();
    if (error) throw error;
    const seen = await kvGet('sb-mpull:' + uidv);
    if (data && data.updated_at !== seen) {
      const first = !seen;
      const rs = new Set((data.data && data.data.starred) || []);
      if (first) S.starred.forEach(x => rs.add(x));
      S.starred = rs;
      S.notes = first ? {...((data.data && data.data.notes) || {}), ...S.notes} : ((data.data && data.data.notes) || {});
      if (data.data && data.data.goal) S.set.goal = data.data.goal;
      metaLocal();
      await kvSet('sb-mpull:' + uidv, data.updated_at);
      if (first) await kvSet('sb-metadirty:' + uidv, true);
      changed = true;

  }

}

/* ---------- audio: decode, fluency stats, WAV for the coach ---------- */
async function decodeBlob(blob) {
  const ab = await blob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  try { return await new Promise((res, rej) => { const p = ac.decodeAudioData(ab.slice(0), res, rej); if (p && p.then) p.then(res, rej); }); }
  finally { try { ac.close(); } catch {} }
}
async function to16k(buf) {
  const len = Math.max(1, Math.ceil(buf.duration * 16000));
  const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const oc = new OC(1, len, 16000);
  const s = oc.createBufferSource(); s.buffer = buf; s.connect(oc.destination); s.start(0);
  const r = await oc.startRendering();
  return r.getChannelData(0);
}
function fluencyStats(pcm, sr = 16000) {
  const fl = Math.round(sr * 0.05), n = Math.floor(pcm.length / fl);
  if (n < 4) return null;
  const rms = new Float32Array(n);
  for (let i = 0; i < n; i++) { let s = 0; for (let k = i * fl; k < (i + 1) * fl; k++) s += pcm[k] * pcm[k]; rms[i] = Math.sqrt(s / fl); }
  const sorted = Array.from(rms).sort((a, b) => a - b);
  const pct = q => sorted[Math.min(n - 1, Math.floor(q * n))];
  const noise = pct(0.12), peak = pct(0.95);
  const thr = Math.max(noise * 2.2, noise + (peak - noise) * 0.1, 0.003);
  const sp = Array.from(rms, v => v > thr);
  for (let i = 1; i < n - 1; i++) if (!sp[i] && sp[i - 1] && sp[i + 1]) sp[i] = true;
  const first = sp.indexOf(true), last = sp.lastIndexOf(true);
  const dur = n * 0.05;
  if (first < 0) return {dur, speechRatio: 0, startDelay: dur, pauses: [], nPause: 0, nLong: 0, longest: 0, env: []};
  const pauses = []; let run = 0, runStart = 0, speechF = 0;
  for (let i = first; i <= last; i++) {
    if (sp[i]) { if (run * 0.05 >= 0.6) pauses.push([+(runStart * 0.05).toFixed(1), +(run * 0.05).toFixed(1)]); run = 0; speechF++; }
    else { if (!run) runStart = i; run++; }
  }
  const span = Math.max(1, last - first + 1);
  const B = 160, env = [];
  for (let b = 0; b < B; b++) { const a = Math.floor(b * n / B), z = Math.max(a + 1, Math.floor((b + 1) * n / B)); let m = 0; for (let i = a; i < z; i++) m = Math.max(m, rms[i]); env.push(Math.min(99, Math.round(m / (peak || 1) * 80))); }
  return {dur: +dur.toFixed(1), speechRatio: +(speechF / span).toFixed(2), startDelay: +(first * 0.05).toFixed(1), pauses, nPause: pauses.length, nLong: pauses.filter(p => p[1] >= 1.5).length, longest: pauses.reduce((m, p) => Math.max(m, p[1]), 0), env};
}
function wavB64(pcm, sr = 16000) {
  const n = pcm.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) { const s = Math.max(-1, Math.min(1, pcm[i])); v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7fff, true); }
  const bytes = new Uint8Array(buf); let bin = ''; const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(bin);
}
const STATS_BUSY = new Set();
async function measureAttempt(id, quiet) {
  const a = getAtt(id); if (!a || STATS_BUSY.has(id)) return null;
  STATS_BUSY.add(id);
  try {
    const b = await getBlob(a); if (!b) return null;
    const pcm = await to16k(await decodeBlob(b));
    const st = fluencyStats(pcm);
    if (st && S.att.has(id)) { if (a.stats && a.stats.target) st.target = a.stats.target; updAtt(id, {stats: st}); }
    return {pcm, st};
  } catch (e) { if (!quiet) toast("Couldn't read this audio to measure pauses."); return null; }
  finally { STATS_BUSY.delete(id); if (!quiet) render(); }
}
const hasStats = st => !!(st && st.env && st.dur != null);
function statsLine(st) {
  if (!hasStats(st)) return '';
  return `${Math.round(st.speechRatio * 100)}% talking · ${st.nPause} pause${st.nPause === 1 ? '' : 's'}${st.nLong ? ` (${st.nLong} long)` : ''}${st.nPause ? ' · longest ' + st.longest.toFixed(1) + 's' : ''} · started at ${st.startDelay.toFixed(1)}s`;
}
function waveSVG(st) {
  if (!st || !st.env || !st.env.length) return '';
  const W = 320, H = 48, n = st.env.length, bw = W / n, sx = W / Math.max(st.dur, 0.1);
  const pauses = st.pauses.map(([t, d]) => `<rect x="${(t * sx).toFixed(1)}" y="0" width="${Math.max(1.5, d * sx).toFixed(1)}" height="${H}" fill="${d >= 1.5 ? 'var(--rec)' : 'var(--warn)'}" opacity=".3"/>`).join('');
  const bars = st.env.map((v, i) => { const h = Math.max(1, v / 99 * (H - 4)); return `<rect x="${(i * bw).toFixed(1)}" y="${((H - h) / 2).toFixed(1)}" width="${Math.max(0.8, bw - 0.6).toFixed(1)}" height="${h.toFixed(1)}" rx=".5" fill="var(--accent)"/>`; }).join('');
  const ticks = []; for (let t = 10; t < st.dur; t += 10) ticks.push(`<text x="${(t * sx).toFixed(1)}" y="${H + 11}" font-size="9" text-anchor="middle" fill="var(--muted)" font-family="var(--mono)">${t}s</text>`);
  return `<svg viewBox="0 0 ${W} ${H + 13}" width="100%" style="display:block;max-width:520px" role="img" aria-label="Waveform with pauses shaded">${pauses}${bars}${ticks.join('')}</svg>
    <div class="small muted" style="margin-top:2px"><span style="display:inline-block;width:9px;height:9px;background:var(--warn);opacity:.45;border-radius:2px"></span> pause 0.6–1.5s <span style="display:inline-block;width:9px;height:9px;background:var(--rec);opacity:.45;border-radius:2px;margin-left:8px"></span> 1.5s+</div>`;
}

const MT = {on: false, t0: 0, mr: null, stream: null, chunks: [], url: null, timer: 0, err: ''};
async function micTestStart() {

  catch (e) { MT.err = 'The microphone is blocked (' + ((e && e.name) || 'error') + '). ' + (STANDALONE ? 'Allow it in the browser address bar and try again.' : "Claude doesn't allow the microphone here; use the website."); S.liveOK = STANDALONE ? S.liveOK : false; render(); return; }
  S.liveOK = true;
  MT.chunks = []; MT.on = true; MT.t0 = Date.now();
  try { MT.mr = new MediaRecorder(MT.stream); } catch { MT.err = 'Recording is not supported in this browser.'; MT.on = false; render(); return; }
  MT.mr.ondataavailable = e => e.data && e.data.size && MT.chunks.push(e.data);
  MT.mr.onstop = () => { const b = new Blob(MT.chunks, {type: (MT.mr.mimeType || 'audio/webm').split(';')[0]}); if (MT.url) URL.revokeObjectURL(MT.url); MT.url = URL.createObjectURL(b); MT.stream.getTracks().forEach(t => t.stop()); render(); const au = $('#mtAudio'); if (au) au.play().catch(() => {}); };
  MT.mr.start(250);
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const an = actx.createAnalyser(); an.fftSize = 512; actx.createMediaStreamSource(MT.stream).connect(an); const buf = new Uint8Array(512);
    const loop = () => { if (!MT.on) return; an.getByteTimeDomainData(buf); let m = 0; for (const v of buf) m = Math.max(m, Math.abs(v - 128)); const el = $('#mtLvl'); if (el) el.style.width = Math.min(100, m / 64 * 100) + '%'; requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } catch {}
  clearInterval(MT.timer);
  MT.timer = setInterval(() => { const left = Math.max(0, 5 - (Date.now() - MT.t0) / 1000); const el = $('#mtLeft'); if (el) el.textContent = left.toFixed(1) + ' s'; if (left <= 0) micTestStop(); }, 100);
  render();
}
function micTestStop() { if (!MT.on) return; MT.on = false; clearInterval(MT.timer); try { MT.mr.stop(); } catch {} }
function micTestCard() {
  return `<div class="card stack" style="gap:10px"><div class="row"><strong class="grow">Microphone test</strong>${MT.on ? '<span class="chip" style="color:var(--rec);border-color:var(--rec)">● Recording</span>' : ''}</div>

    body = STUDY.vocab.map(([g, l]) => `<div class="sec-h"><h3>${esc(g)}</h3></div><div class="list">${l.map(([en, ru]) => `<div class="li"><div class="grow"><div class="t">${esc(en)}</div>${ru ? `<div class="s">${esc(ru)}</div>` : ''}</div>${useBtn(en)}${saveBtn(en, ru, '')}</div>`).join('')}</div>`).join('');
  } else {
    body = STUDY.grammar.map(([n, ru, f, ex]) => `<div class="card stack" style="gap:8px;margin-top:10px"><div class="row"><strong class="grow">${esc(n)}</strong><span class="small muted">${esc(ru)}</span></div><div class="small" style="font-family:var(--mono)">${esc(f)}</div>${ex.map(([a, b]) => `<div class="small"><span class="muted">${esc(a)}</span><br><b>${esc(b)}</b></div>`).join('')}<div class="row">${useBtn(n + ' (' + f + ')')}</div></div>`).join('') + `<div class="small muted" style="margin-top:10px">These fit Part 3 best. In Part 1 they can sound stiff.</div>`;
  }
  return `<div class="stack"><h2 style="font-size:24px">Study</h2>${seg}${body}</div>`;
}

/* ---------- admin view ---------- */
const AD = {data: null, loading: false, err: '', msg: ''};
async function adminLoad() { AD.loading = true; AD.err = ''; render(); try { AD.data = await api('admin_list'); } catch (e) { AD.err = e.message; } AD.loading = false; render(); }
async function adminDo(action, body, okMsg) { try { const r = await api(action, body); if (okMsg) toast(typeof okMsg === 'function' ? okMsg(r) : okMsg); await adminLoad(); if (action === 'admin_config') sbStatus(); return r; } catch (e) { toast(e.message, 6000); } }
function viewAdmin() {
  if (!SB.me || !SB.me.admin) return `<div class="card empty">Admins only. ${SB.user ? '' : 'Sign in first.'}</div>`;
  if (!AD.data && !AD.loading && !AD.err) { setTimeout(adminLoad, 0); }
  const d = AD.data;
  const cfgc = d ? d.config : {};
  const users = d ? d.users : [];
  return `<div class="stack">
    <div class="row"><h2 class="grow" style="font-size:24px">Admin</h2><button class="btn" data-act="adreload">Refresh</button></div>
    ${AD.err ? `<div class="card small" style="color:var(--rec)">${esc(AD.err)}</div>` : ''}
    <div class="card stack" style="gap:10px"><strong>Add people</strong>
      <div class="small muted">Telegram usernames, without @, separated by spaces, commas or new lines. Their first password is their username; they'll be asked to change it.</div>
      <textarea id="adNames" rows="2" placeholder="friend_one, friend_two"></textarea>
      <div class="row"><button class="btn primary" data-act="adadd">Add</button></div></div>
    <div class="sec-h"><h3>People (${users.length})</h3></div>
    <div class="list">${AD.loading && !d ? '<div class="empty">Loading…</div>' : users.map(u => `<div class="li" style="flex-wrap:wrap"><div class="grow"><div class="t">@${esc(u.username)} ${u.admin ? '<span class="pill">admin</span>' : ''}</div>
      <div class="s">${u.joined ? `signed in ${u.last ? when(Date.parse(u.last)) : '—'}${u.mustChange ? ' · still using username as password' : ''}` : 'not signed in yet'} · ${u.takes} takes · ${u.ai} coach uses</div></div>
      <div class="row" style="gap:6px">${u.joined ? `<button class="btn ghost" style="padding:5px 9px" data-act="adreset" data-u="${esc(u.username)}">Reset password</button>` : ''}
      ${u.username !== myName() ? `<button class="btn ghost" style="padding:5px 9px" data-act="adadmin" data-u="${esc(u.username)}" data-v="${u.admin ? '' : '1'}">${u.admin ? 'Remove admin' : 'Make admin'}</button><button class="btn ghost danger" style="padding:5px 9px" data-act="adremove" data-u="${esc(u.username)}">Remove</button>` : ''}</div></div>`).join('')}</div>
    <div class="card stack" style="gap:10px"><div class="row"><strong class="grow">Gemini coach</strong><span class="chip ${cfgc.hasKey ? 'ok' : 'warn'}">${cfgc.hasKey ? 'Key saved ' + esc(cfgc.keyHint) : 'No key yet'}</span></div>
      <div class="small muted">Get a free key at aistudio.google.com/apikey and paste it here. It's stored on the server only; nobody using the app can read it.</div>
      <input type="password" id="adKey" autocomplete="off" placeholder="${cfgc.hasKey ? 'Paste a new key to replace it' : 'Paste your Gemini API key'}">
      <div class="row"><button class="btn primary" data-act="adkey">Save key</button><button class="btn" data-act="adtest" ${cfgc.hasKey ? '' : 'disabled'}>Test</button>${cfgc.hasKey ? '<button class="btn ghost danger" data-act="adkeydel">Remove key</button>' : ''}</div>
      <label class="sw"><span><span style="font-weight:500">Coach uses per person per day</span><br><span class="small muted">Protects your free Gemini quota</span></span><input type="text" id="adLimit" value="${esc(cfgc.daily_limit || '60')}" style="width:80px"></label>
      <label class="sw"><span><span style="font-weight:500">Model</span><br><span class="small muted">gemini-flash-latest follows Google's newest Flash model</span></span><input type="text" id="adModel" value="${esc(cfgc.model || 'gemini-flash-latest')}" style="width:190px"></label>
      <div class="row"><button class="btn" data-act="adcfg">Save limits</button></div></div>
  </div>`;
}

/* ---------- home extras: goal + trends ---------- */
function goalCard() {
  const goal = S.set.goal || 10, today = allAttempts().filter(a => dayKey(a.ts) === dayKey(Date.now())).length;
  const pct = Math.min(1, today / goal), R0 = 26, C = 2 * Math.PI * R0;
  const analysed = allAttempts().filter(a => a.ai && a.ai.bands && a.ai.bands.overall).sort((a, b) => a.ts - b.ts).slice(-20);
  const pts = analysed.map(a => +a.ai.bands.overall);
  let spark = '<div class="small muted">Analyse a few takes with the coach to see your band trend here.</div>';
  if (pts.length >= 2) {
    const W = 200, H = 50, lo = 4, hi = 9, x = i => (i / (pts.length - 1)) * W, y = v => H - ((v - lo) / (hi - lo)) * H;
    spark = `<svg viewBox="-4 -4 ${W + 8} ${H + 8}" width="100%" style="max-width:260px" role="img" aria-label="Band estimates over time"><line x1="0" x2="${W}" y1="${y(7)}" y2="${y(7)}" stroke="var(--line)" stroke-dasharray="3 3"/><polyline fill="none" stroke="var(--accent)" stroke-width="2" points="${pts.map((v, i) => x(i).toFixed(1) + ',' + y(v).toFixed(1)).join(' ')}"/><circle cx="${x(pts.length - 1)}" cy="${y(pts[pts.length - 1])}" r="3.5" fill="var(--accent)"/></svg><div class="small muted">Coach band estimates, last ${pts.length} · latest ${pts[pts.length - 1]} · dashed line = 7.0</div>`;
  }
  const withStats = allAttempts().filter(a => hasStats(a.stats) && a.stats.dur > 5).sort((a, b) => b.ts - a.ts).slice(0, 15);
  const avgLong = withStats.length ? (withStats.reduce((s, a) => s + a.stats.nLong / (a.stats.dur / 60), 0) / withStats.length).toFixed(1) : null;
  return `<div class="card row" style="gap:16px;align-items:center">
    <svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Daily goal ${today} of ${goal}"><circle cx="32" cy="32" r="${R0}" fill="none" stroke="var(--line)" stroke-width="7"/><circle cx="32" cy="32" r="${R0}" fill="none" stroke="var(--ok)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(C * pct).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 32 32)"/><text x="32" y="37" text-anchor="middle" font-size="15" font-family="var(--mono)" fill="var(--ink)">${today}/${goal}</text></svg>
    <div class="grow"><strong>Today's goal</strong><div class="goalstats">${(() => { const st = stats(); return `${st.n} recording${st.n === 1 ? '' : 's'} · ${Math.round(st.secs / 60)} min spoken · ${st.streak}-day streak`; })()}</div><div class="small muted">${today >= goal ? 'Done for today. Anything more is a bonus.' : `${goal - today} more answer${goal - today === 1 ? '' : 's'} to go.`}${avgLong !== null ? ` Long pauses lately: ${avgLong} per minute.` : ''}</div>
    <div style="margin-top:6px">${spark}</div></div></div>`;
}

const CH = {on: false, target: null, qid: null};
function challengeCard(qid) {
  if (!CH.on) return `<div class="row"><button class="btn" data-act="chtoggle" style="font-weight:500">${I.spark} Challenge mode</button><span class="small muted grow">get a phrase to fit into your answer</span></div>`;
  CH.qid = qid;
  const t = CH.target || {};
  return `<div class="card challenge stack" style="gap:6px"><div class="row"><strong class="grow">Use this in your answer</strong><button class="btn ghost" style="padding:4px 8px" data-act="chnew">Another</button><button class="iconbtn" data-act="chtoggle" aria-label="Turn off challenge">${I.x}</button></div>
    <div style="font-size:18px;font-weight:600">${esc(t.t || '')}</div>${t.ru ? `<div class="small muted">${esc(t.ru)}</div>` : ''}${t.ex ? `<div class="small muted">e.g. ${esc(t.ex)}</div>` : ''}
    <div class="small muted">Make it sound natural. The coach will tell you if it did.</div></div>`;
}

/* ---------- events ---------- */
function mockOpts(qid, b) { return M.on && M.phase !== 'done' && M.plan[M.i] && M.plan[M.i].qid === qid && !b.closest('#sheet') ? {sid: M.sid, onDone: mockSaved} : {}; }
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, d = b.dataset;
  switch (act) {
    case 'go': location.hash = d.to; break;
    case 'closesheet': closeSheetAll(); render(); break;
    case 'backsheet': closeSheet(); break;
    case 'openq': openSheet({type: 'q', id: d.q}); break;
    case 'opentopic': openSheet({type: 'topic', id: d.id}); break;
    case 'opencard': openSheet({type: 'card', id: d.id}); break;
    case 'opensess': openSheet({type: 'sess', id: d.id}); break;
    case 'rec': startRec(d.q, {limit: Q.get(d.q).part === 2 ? 120 : 0}); break;
    case 'mrec': { const st = M.plan[M.i]; startRec(st.qid, {sid: M.sid, limit: st.part === 2 ? 120 : 0, onDone: mockSaved}); break; }
    case 'dictate': startRec(d.q, {kind: 'dict', limit: Q.get(d.q).part === 2 ? 120 : 0, ...mockOpts(d.q, b)}); break;
    case 'recstop': stopRec(); break;
    case 'upload': uploadFor(d.q, mockOpts(d.q, b)); break;
    case 'play': if (d.a) playAtt(d.a); break;
    case 'say': speak(Q.get(d.q).part === 2 ? CM.get(Q.get(d.q).pid).cue : Q.get(d.q).t, true); break;
    case 'reveal': M.reveal = true; render(); break;
    case 'star': { const id = d.q; S.starred.has(id) ? S.starred.delete(id) : S.starred.add(id); saveMeta(); render(); break; }
    case 'ideas': getIdeas(d.q); break;
    case 'feedback': getFeedback(d.a); break;
    case 'del': deleteAttempt(d.a); break;
    case 'dl': downloadAttempt(d.a); break;
    case 'retry': retryUpload(d.a); break;
    case 'speed': { const sp = [1, 1.25, 1.5, 2]; S.set.speed = sp[(sp.indexOf(S.set.speed || 1) + 1) % sp.length]; player.playbackRate = S.set.speed; saveMeta(); render(); break; }
    case 'prep': startPrep(d.c); break;
    case 'quickdrill': DR.parts = d.p; DR.onlyNew = !!d.new; DR.onlyStar = false; buildDeck(); location.hash = 'drill'; render(); break;
    case 'starredrill': DR.parts = '123'; DR.onlyNew = false; DR.onlyStar = true; buildDeck(); closeSheetAll(); location.hash = 'drill'; render(); break;
    case 'drilltopic': { const t = TM.get(d.id); DR.deck = t.qs.map(q => q.id); DR.i = 0; DR.fixed = true; DR.label = 'Topic: ' + t.title; closeSheetAll(); location.hash = 'drill'; render(); break; }
    case 'drillcard': { const c = CM.get(d.id); DR.deck = [c.p2id, ...c.p3.map(q => q.id)]; DR.i = 0; DR.fixed = true; DR.label = 'Card: ' + cueShort(c); closeSheetAll(); location.hash = 'drill'; render(); break; }
    case 'drillreset': DR.fixed = false; buildDeck(); render(); break;
    case 'dparts': DR.parts = d.v; buildDeck(); render(); break;
    case 'dnew': DR.onlyNew = !DR.onlyNew; buildDeck(); render(); break;
    case 'dstar': DR.onlyStar = !DR.onlyStar; buildDeck(); render(); break;
    case 'dnext': if (R.on) stopRec(); stopSpeak(); if (DR.i < DR.deck.length - 1) DR.i++; else { if (!DR.fixed) { DR.deck = shuffle(DR.deck); } DR.i = 0; toast(DR.fixed ? 'Back to the first question.' : 'Deck finished: reshuffled.'); } render(); window.scrollTo(0, 0); if (S.set.voice && Q.get(DR.deck[DR.i])) speak(Q.get(DR.deck[DR.i]).part === 2 ? CM.get(Q.get(DR.deck[DR.i]).pid).cue : Q.get(DR.deck[DR.i]).t); break;
    case 'dprev': if (R.on) stopRec(); if (DR.i > 0) DR.i--; render(); break;
    case 'btab': BR.tab = d.v; BR.q = ''; render(); break;
    case 'hpart': HI.part = +d.v; render(); break;
    case 'mkind': M.cfg.kind = d.v; render(); break;
    case 'mset': M.cfg.set = +d.v; render(); break;
    case 'mstart': beep(0, .001); mockStart(); break;
    case 'mnext': mockNext(); break;
    case 'prepskip': M.prepEnd = Date.now(); prepOver(); break;
    case 'mend': (async () => { if (await confirmBox('End the test now?', 'Answers you already recorded are kept.', 'End test')) { if (R.on) await stopRec(); mockFinish(); } })(); break;
    case 'mclose': M.on = false; M.phase = ''; render(); break;
    case 'redo': { const s = S.sessions.find(x => x.id === d.s) || M.sess; if (!s) break; closeSheetAll(); const card = CM.get(s.card); const plan = s.plan.map(qid => { const q = Q.get(qid); return {qid, part: q.part, intro: ''}; }); let lt = null; plan.forEach((p, i) => { const q = Q.get(p.qid); if (p.part === 1 && q.pid !== lt) { p.intro = topicIntro(TM.get(q.pid), i === 0); lt = q.pid; } }); const f3 = plan.find(p => p.part === 3); if (f3) f3.intro = `We've been talking about ${cueShort(card)}, and I'd like to discuss with you one or two more general questions related to this.`; const sid = uid('s'); Object.assign(M, {on: true, plan, i: 0, sid, card: card.id, t0: Date.now(), phase: 'ask'}); M.sess = {id: sid, ts: Date.now(), set: s.set || null, card: card.id, plan: s.plan.slice(), items: [], scores: {}, note: '', done: false}; saveSession(M.sess); clearInterval(M.clock); M.clock = setInterval(updRunnerClock, 500); location.hash = 'mock'; speakThenStep(true); break; }
    case 'playall': { const s = S.sessions.find(x => x.id === d.s) || M.sess; if (!s) break; if (M.playingSess === s.id && (playQueue.length || !player.paused)) { playQueue = []; player.pause(); M.playingSess = null; playIcons(); break; } const ids = s.plan.map(q => (s.items || []).find(x => x.qid === q)).filter(Boolean).map(x => x.aid); if (!ids.length) return toast('No answers recorded in this test.'); M.playingSess = s.id; playQueue = ids.slice(1); playAtt(ids[0], true); break; }
    case 'delsess': (async () => { if (!await confirmBox('Remove this test from history?', 'The recordings stay in your attempts list.', 'Remove')) return; const id = d.s; S.sessions = S.sessions.filter(x => x.id !== id); closeSheetAll(); render(); try { if (db) await db.doc('sessions/' + id).delete(); else { await IDB.del('kv', 'sess:' + id); if (STANDALONE) sbMarkSess(id); } } catch {} })(); break;
    case 'fspick': fsPick(); break;
    case 'sbin': sbAuth(); break;
    case 'pwsave': sbSavePw(); break;
    case 'pwlater': SB.pwLater = true; render(); break;
    case 'sttab': ST.tab = d.v; ST.revealed = false; render(); break;
    case 'phshow': ST.revealed = true; render(); break;
    case 'phok': reviewPhrase(d.id, true); break;
    case 'phagain': reviewPhrase(d.id, false); break;
    case 'phdel': delPhrase(d.id); break;
    case 'addph': { try { addPhrase(JSON.parse(d.p)); } catch {} break; }
    case 'usechallenge': { CH.on = true; CH.target = {t: d.t}; DR.parts = '13'; buildDeck(); CH.qid = DR.deck[0]; location.hash = 'drill'; render(); window.scrollTo(0, 0); break; }
    case 'chtoggle': CH.on = !CH.on; if (CH.on && !CH.target) CH.target = pick(challengePool()); render(); break;
    case 'chnew': CH.target = pick(challengePool()); render(); break;
    case 'saytext': speak(d.t, true); break;
    case 'coach': coachAttempt(d.a); break;
    case 'coachideas': coachIdeas(d.q); break;
    case 'ideasfresh': coachIdeas(d.q, true); break;
    case 'measure': measureAttempt(d.a); break;
    case 'coachall': (async () => { const s = S.sessions.find(x => x.id === d.s) || M.sess; if (!s) return; const ids = (s.items || []).map(x => x.aid).filter(id => { const a = getAtt(id); return a && !a.ai; }); if (!ids.length) return toast('Every answer already has feedback.'); toast('Analysing ' + ids.length + ' answers… you can keep using the app.'); for (const id of ids) await coachAttempt(id); toast('All answers analysed.'); })(); break;
    case 'mtstart': micTestStart(); break;
    case 'mtstop': micTestStop(); break;
    case 'adreload': adminLoad(); break;
    case 'adadd': adminDo('admin_add', {usernames: ($('#adNames') || {}).value || ''}, r => (r.added.length ? 'Added: ' + r.added.join(', ') : 'Nothing added') + (r.bad.length ? '. Not valid: ' + r.bad.join(', ') : '')); break;
    case 'adreset': (async () => { if (await confirmBox('Reset @' + d.u + "'s password?", 'Their password becomes their username again, and they will be asked to set a new one.', 'Reset')) adminDo('admin_reset', {username: d.u}, 'Password reset. Tell them to sign in with their username as the password.'); })(); break;
    case 'adadmin': adminDo('admin_admin', {username: d.u, value: !!d.v}, 'Updated.'); break;
    case 'adremove': (async () => { if (await confirmBox('Remove @' + d.u + '?', 'They lose access and all their recordings and feedback are deleted. This cannot be undone.', 'Remove')) adminDo('admin_remove', {username: d.u}, 'Removed.'); })(); break;
    case 'adkey': { const k = (($('#adKey') || {}).value || '').trim(); if (!k) { toast('Paste the key first.'); break; } adminDo('admin_config', {gemini_key: k}, 'Key saved. Tap Test to check it.'); break; }
    case 'adkeydel': (async () => { if (await confirmBox('Remove the Gemini key?', 'The coach stops working for everyone until you add a key again.', 'Remove')) adminDo('admin_config', {gemini_key: ''}, 'Key removed.'); })(); break;
    case 'adtest': adminDo('admin_test', {}, r => 'Gemini works (' + r.model + ').'); break;
    case 'adcfg': adminDo('admin_config', {daily_limit: ($('#adLimit') || {}).value, model: ($('#adModel') || {}).value}, 'Saved.'); break;
    case 'sbsync': syncNow().then(() => toast(SB.state === 'ok' ? 'Synced.' : 'Sync failed: ' + SB.err)); break;
    case 'sbout': sbSignOut(); break;

    case 'export': exportAll(); break;
    case 'import': { const i = $('#impFile'); i.value = ''; i.click(); break; }
    case 'fsreconnect': fsReconnect(); break;
    case 'testvoice': speak('Good morning. Can you tell me your full name, please? And what should I call you?', true); break;
    case 'testmic': (async () => { try { const s = await navigator.mediaDevices.getUserMedia({audio: true}); s.getTracks().forEach(t => t.stop()); S.liveOK = true; toast('Microphone works in this view.'); } catch (err) { S.liveOK = false; toast('Microphone is blocked here (' + ((err && err.name) || 'error') + '). Recording will use ' + (recKind() === 'dict' ? 'speech-to-text.' : "your phone's voice recorder.")); } render(); })(); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.act === 'setb') { S.set[d.k] = t.checked; saveMeta(); render(); }
  else if (d.act === 'setv') { const v = t.value; S.set[d.k] = isNaN(+v) || v === '' ? v : +v; if (d.k === 'theme') applyTheme(); saveMeta(); render(); }
  else if (d.act === 'srcsel') { S.set.src = t.value; saveMeta(); if (!DR.fixed) buildDeck(); render(); }
  else if (d.act === 'score') updAtt(d.a, {score: t.value || null});
  else if (d.act === 'sscore') { const s = S.sessions.find(x => x.id === d.s) || M.sess; if (s) { s.scores = {...(s.scores || {}), [d.k]: t.value}; saveSession(s); render(); } }
  else if (d.note) updAtt(d.note, {note: t.value});
  else if (t.dataset.cnote) { S.notes[t.dataset.cnote] = t.value; saveMeta(); }
  else if (t.dataset.snote) { const s = S.sessions.find(x => x.id === t.dataset.snote) || M.sess; if (s) { s.note = t.value; saveSession(s); } }
});
let sT;
document.addEventListener('input', e => { if (e.target.id === 'bsearch') { clearTimeout(sT); const v = e.target.value; sT = setTimeout(() => { BR.q = v; const pos = e.target.selectionStart; render(); const i = $('#bsearch'); if (i) { i.focus(); try { i.setSelectionRange(pos, pos); } catch {} } }, 200); } });
document.addEventListener('toggle', e => { if (e.target.matches && e.target.matches('details[data-filters]')) DR.filtersOpen = e.target.open; }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.target.id === 'sbPass' || e.target.id === 'sbUser')) { e.preventDefault(); sbAuth(); return; }
  if (e.target.matches('input,textarea,select')) return;
  if (e.key === 'Escape' && SH.length) { closeSheet(); return; }
  if (e.code === 'Space') {
    const r = route(); let qid = null;
    if (SH.length && SH[SH.length - 1].type === 'q') qid = SH[SH.length - 1].id; else if (r === 'drill') qid = DR.deck[DR.i]; else if (r === 'mock' && M.on && M.phase === 'answer') qid = M.plan[M.i].qid;
    if (!qid) return; e.preventDefault();
    if (R.on) stopRec(); else if (r === 'mock' && M.on && !SH.length) $('[data-act="mrec"]') && $('[data-act="mrec"]').click(); else startRec(qid, {limit: Q.get(qid).part === 2 ? 120 : 0});
  } else if (e.key === 'n' || e.key === 'N' || e.key === 'ArrowRight') {
    if (route() === 'drill' && !SH.length) $('[data-act="dnext"]') && $('[data-act="dnext"]').click();
    else if (route() === 'mock' && M.on && M.phase !== 'done') mockNext();
  }
});
window.addEventListener('beforeunload', e => { if (R.on) { e.preventDefault(); e.returnValue = ''; } });
init();
</script>
</body>
